<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KDN MAP 로그인</title>
  <style>
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff7c2;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
    body{display:flex;align-items:center;justify-content:center}
    .login-stage{position:relative;height:100vh;max-height:1536px;aspect-ratio:2/3;max-width:100vw;background:url("KDN_MAP_Login_Final.png") center/100% 100% no-repeat}
    /* 이미지의 입력창/버튼 모양은 그대로 두고 실제 입력 영역만 정확히 겹칩니다. */
    .form-overlay{position:absolute;left:15.5%;right:15.5%;top:49.15%;height:29%;}
    .input{position:absolute;left:12.5%;width:78%;height:23.5%;border:0;border-radius:0;background:rgba(255,255,255,.985);padding:0 1.5%;font-size:clamp(14px,2.0vh,24px);outline:none;color:#111827;box-shadow:none}
    .input:focus{outline:none;box-shadow:none}
    #loginId{top:0}
    .password-wrap{position:absolute;left:0;top:40.7%;width:100%;height:23.5%}
    .password-wrap .input{left:12.5%;width:72%;height:100%;top:0;padding:0 1.5%}
    #togglePassword{position:absolute;right:0;top:0;width:14%;height:100%;border:0;background:transparent;color:transparent;font-size:0;cursor:pointer;padding:0}
    .login-btn{position:absolute;left:-0.7%;top:73.0%;width:101.4%;height:28.5%;border:0;border-radius:28px;background:transparent;color:transparent;font-size:0;font-weight:900;cursor:pointer;padding:0}
    .login-btn:disabled{opacity:.72}.error{position:absolute;left:0;right:0;top:108%;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.96);color:#be123c;font-size:12px;font-weight:700;text-align:center;display:none}
    @media (max-aspect-ratio:2/3){.login-stage{width:100vw;height:auto;aspect-ratio:2/3}}
  </style>
</head>
<body>
  <main class="login-stage" aria-label="KDN MAP 로그인">
    <section class="form-overlay">
      <input id="loginId" class="input" type="text" placeholder="아이디를 입력하세요" autocomplete="username" aria-label="아이디" />
      <div class="password-wrap">
        <input id="password" class="input" type="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password" aria-label="비밀번호" />
        <button id="togglePassword" type="button" aria-label="비밀번호 표시">◉</button>
      </div>
      <button id="loginBtn" class="login-btn" type="button">로그인</button>
      <div id="error" class="error"></div>
    </section>
  </main>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDfpnGLUxcqY69szJCmbWE10s2Mv9xF7Cw",
      authDomain: "kdn-map.firebaseapp.com",
      projectId: "kdn-map",
      storageBucket: "kdn-map.firebasestorage.app",
      messagingSenderId: "774166998071",
      appId: "1:774166998071:web:d99011e3487d86849e23b2",
      measurementId: "G-DE4C2P3GKZ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const params = new URLSearchParams(window.location.search);
    const next = params.get("next") || "index.html";

    const loginIdEl = document.getElementById("loginId");
    const passwordEl = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const errorEl = document.getElementById("error");

    function showError(message) {
      errorEl.textContent = message;
      errorEl.style.display = "block";
    }

    function normalizeLoginId(value) {
      const id = String(value || "").trim();
      return id.includes("@") ? id : `${id}@kdn.local`;
    }

    async function doLogin() {
      const loginId = loginIdEl.value.trim();
      const password = passwordEl.value;
      errorEl.style.display = "none";

      if (!loginId || !password) {
        showError("아이디와 비밀번호를 입력하세요.");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "로그인 중...";

      try {
        await signInWithEmailAndPassword(auth, normalizeLoginId(loginId), password);
        window.location.href = next;
      } catch (e) {
        showError("로그인 실패: 아이디 또는 비밀번호를 확인하세요.");
        loginBtn.disabled = false;
        loginBtn.textContent = "로그인";
      }
    }

    loginBtn.addEventListener("click", doLogin);

    const togglePasswordBtn = document.getElementById("togglePassword");
    if (togglePasswordBtn) togglePasswordBtn.addEventListener("click", () => {
      passwordEl.type = passwordEl.type === "password" ? "text" : "password";
    });
    passwordEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") doLogin();
    });
    loginIdEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") passwordEl.focus();
    });

    onAuthStateChanged(auth, (user) => {
      if (user) window.location.replace(next);
    });
  </script>
</body>
</html>
